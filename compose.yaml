# NameNotFound - local development environment
#
# Usage:
#   1. Copy .env.example to .env and set a strong password.
#   2. docker compose up -d
#   3. docker compose ps        (wait until the service is "healthy")
#
# Values come from the .env file next to this file. Never commit .env.

name: namenotfound

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: namenotfound-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # Free edition for development and testing only (not for production).
      MSSQL_PID: "EnterpriseDeveloper"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the .env file}"
    ports:
      # Bound to 127.0.0.1 so the database is reachable only from this machine.
      - "127.0.0.1:${MSSQL_HOST_PORT:-1433}:1433"
    volumes:
      # Keeps databases between restarts. "docker compose down -v" deletes it.
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # $$ passes the variable to the container shell instead of Compose,
      # so the password is never written in this file.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  sqlserver-data:
